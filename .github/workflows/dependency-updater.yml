name: Dependency Update

on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.7.12"

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Upgrade dependencies
        run: |
          uv lock --upgrade

      - name: Check for changes and bump version
        id: check-changes
        run: |
          set -euo pipefail
          git add uv.lock
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"

            CURRENT=$(grep -E '^version = "' pyproject.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')
            IFS='.' read -r MAJ MIN PAT <<< "${CURRENT}"
            NEW="${MAJ}.${MIN}.$((PAT + 1))"
            sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"${NEW}\"/" pyproject.toml
            git add pyproject.toml
            echo "Bumped version: ${CURRENT} -> ${NEW}"
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update dependencies and bump version"
          title: "chore: update dependencies"
          body: |
            This PR was automatically created by the dependency update workflow.

            The following dependencies have been updated:
            - See `uv.lock` for details

            The project PATCH version in `pyproject.toml` was bumped accordingly.

            Please review and merge if the changes look good.
          branch: dependabot/update-dependencies
          delete-branch: true
          labels: |
            dependencies
            automated
